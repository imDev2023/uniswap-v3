name: EVM security

# The point of this workflow is that it FAILS. A security workflow that only ever
# reports is a dashboard, and dashboards do not stop deployments.
#
# Jobs are ordered cheapest-first so that a formatting mistake does not wait behind a
# twenty-minute fuzzing campaign, but nothing is `continue-on-error` except the two
# scheduled deep-fuzz jobs, which run on a cadence rather than gating a pull request.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly deep campaigns. Coverage that a per-commit run cannot afford.
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

defaults:
  run:
    working-directory: contracts

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ⚠️ The REPO's config, not the submodule's shared baseline. The two started identical and
      # can no longer be: the baseline requires solc ^0.8.30 while this repo pins 0.8.24 on purpose
      # (evm_version paris, PUSH0-free for Orbit), which failed every source file with a
      # compiler-version error. `not-rely-on-time` is also off here, because chain 4663's profile
      # says block.number is NOT a clock, so block.timestamp is the only one available and the rule
      # cannot be satisfied. Reasons are recorded in docs/security-checklist.md.
      - name: Solhint
        run: |
          npm install --no-save solhint
          npx solhint --config .solhint.json --max-warnings 0 'src/**/*.sol'

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1

      # ⚠️ Load-bearing, and its absence is what made the FIRST CI run this project ever had go red.
      # contracts/remappings.txt maps `@openzeppelin/=node_modules/@openzeppelin/`, and
      # contracts/node_modules/ is gitignored - so solc cannot resolve a single OpenZeppelin import on
      # a fresh checkout. Reproduced on a clean clone: `forge build` fails with Error (6275) without
      # this step and exits 0 with it. The @uniswap/v3-* artifacts vm.getCode reads live here too
      # (foundry.toml's fs_permissions grants ./node_modules). Never delete this to "speed up" a job
      # that compiles Solidity.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Solidity dependencies
        run: npm ci

      # deny_warnings in foundry.toml makes this fail on any compiler warning.
      - name: Build
        run: forge build --sizes

  test:
    name: Tests and invariants
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1

      # Same reason as the build job: no node_modules, no OpenZeppelin, no compile. Jobs do not share
      # a filesystem, so every job that compiles Solidity needs its own copy.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Solidity dependencies
        run: npm ci

      # ⚠️ RESTORE/SAVE split ON PURPOSE, and the reason is the whole point of the step.
      # `actions/cache` saves only when the job SUCCEEDS. This job's failure mode is a cold cache
      # causing 429s, so the plain action would never save on the run that most needed it and CI
      # could never converge - each run would start cold, fail, and discard what it had fetched.
      # Splitting restore from a save with `if: always()` means every run keeps whatever fork state
      # it managed to pull, so even a red run leaves the next one warmer.
      # Keyed on ForkConfig.sol because EVERY fork block is pinned there: same file, same blocks,
      # same cache. Change a pinned block and the key changes with it.
      - name: Restore Foundry fork cache
        id: forkcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.foundry/cache/rpc
          # The run_id suffix makes every save a NEW entry rather than a collision against an
          # existing key, and the restore-keys prefixes then pick the most recent match. Without it
          # the second save onwards is a no-op and the cache freezes at whatever the first run got.
          key: foundry-rpc-${{ hashFiles('contracts/test/ForkConfig.sol') }}-${{ github.run_id }}
          restore-keys: |
            foundry-rpc-${{ hashFiles('contracts/test/ForkConfig.sol') }}-
            foundry-rpc-

      # ⚠️ Every fork test is PINNED to an ARCHIVE endpoint (contracts/test/ForkConfig.sol) and fails
      # LOUDLY without these, which is the intended behaviour - a fork test silently falling back to a
      # pruning endpoint is how flakiness got in. They live in contracts/.env locally and must be
      # added as repository secrets before this job can pass. Until they are, this step is the one
      # thing standing between this workflow and green.
      - name: Unit and fuzz tests
        env:
          RPC_MAINNET_ARCHIVE_URL: ${{ secrets.RPC_MAINNET_ARCHIVE_URL }}
          RPC_TESTNET_ARCHIVE_URL: ${{ secrets.RPC_TESTNET_ARCHIVE_URL }}
        # ⚠️ `--compute-units-per-second` is why this passes. Run #2 failed 19 tests with
        # `Max retries exceeded HTTP error 429` and ZERO assertion failures. The identical command
        # passes locally only because ~/.foundry/cache/rpc already holds 131 pinned fork blocks;
        # a runner starts cold, so every read is live. `[profile.ci.fuzz] runs = 1024` multiplies it,
        # because a fuzzed address is one the fork has never seen and `vm.deal` on it is a network
        # round trip - the same mechanism that killed the invariant campaigns in #40, now hitting the
        # example-based suites. Foundry assumes 330 CUPS per provider and runs suites in PARALLEL, so
        # the aggregate sails past any single-provider budget.
        # ⚠️ It MUST be a flag. As a foundry.toml profile key forge 1.7.1 calls it unknown and
        # silently ignores it; see the note in contracts/foundry.toml.
        #
        # ⚠️ `--threads 1` is the half that actually works, and run #3 is the evidence.
        # `--compute-units-per-second` alone took the failures from 19 to 13 and no further, because
        # it is a PER-PROVIDER budget while forge runs test suites in PARALLEL - 19 suites each
        # entitled to 100 CUPS is 1,900 CUPS in aggregate, so the throttle was never the binding
        # constraint. Serialising the suites is what puts the aggregate back under one budget.
        # Cost is wall-clock, which is free on a public repo, and it falls as the fork cache fills.
        run: forge test -vvv --threads 1 --compute-units-per-second 100

      # `if: always()` is the load-bearing half. See the restore step: a red run is exactly the run
      # whose fetched fork state is most worth keeping.
      - name: Save Foundry fork cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ hashFiles('contracts/test/ForkConfig.sol') }}-${{ github.run_id }}

      # ⚠️ Deliberately needs NO secrets. The invariant campaign is the one suite here that does not
      # fork: Foundry gives each `invariant_` function its own campaign, each re-runs `setUp` against
      # the fork, and every uncached address the fuzzer touches is an RPC call - the archive endpoint
      # returned HTTP 429 and all five campaigns died in setup with `runs: 0`. It stands up a local
      # WETH9 instead (test/mocks/MockWETH9.sol) and still deploys the real audited V3 bytecode. So
      # this step gates every commit even on a fork without access to the secrets above.
      - name: Invariants
        id: invariants
        run: forge test --match-test "invariant_" -vvv

      - name: Coverage
        run: forge coverage --report summary --report lcov
        continue-on-error: true

      - name: Record evidence
        if: success()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path(".evm-standards.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg.setdefault("evidence", {})["forge-invariant"] = {
              "clean": True,
              "summary": "forge invariant suite passed in CI",
          }
          p.write_text(json.dumps(cfg, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-forge
          path: contracts/.evm-standards.json

  slither:
    name: Slither
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1

      # Same reason as the build job.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Solidity dependencies
        run: npm ci

      # ⚠️ `target` is LOAD-BEARING, and its absence was a SILENT PASS rather than a failure.
      # `defaults.run.working-directory` applies to `run:` steps only, NEVER to `uses:` steps, and
      # this action defaults `target` to the repository root - which holds no foundry.toml, because
      # the Foundry project is contracts/. Measured locally: from the root the same command reports
      # "No contract was analyzed", 0 contracts, 0 results, and EXIT 0. So this job would have gone
      # GREEN having inspected nothing, and its `if: success()` step below would then have recorded
      # evidence reading "no findings at medium or above". From contracts/ it analyzes 38 contracts
      # and returns 15 results. A security job that cannot fail is a dashboard.
      - uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          target: contracts/
          # The repo's own copy, for the same reason the Solhint step uses the repo's: a project's
          # triage decisions belong to the project, not to the shared baseline it started from.
          slither-config: contracts/slither.config.json
          fail-on: medium

      - name: Record evidence
        if: success()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path(".evm-standards.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg.setdefault("evidence", {})["slither"] = {
              "clean": True,
              "summary": "no findings at medium or above",
          }
          p.write_text(json.dumps(cfg, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-slither
          path: contracts/.evm-standards.json

  gate:
    name: Pre-deployment gate
    runs-on: ubuntu-latest
    needs: [test, slither]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      # Merge the evidence both upstream jobs recorded. The gate reads results rather
      # than re-running the tools, so it stays fast enough to run locally too.
      # ⚠️ `path` is resolved from the WORKSPACE ROOT, not from `defaults.run.working-directory`, but
      # the merge step below is a `run:` step and therefore executes inside contracts/. Written as
      # `path: evidence` the artifacts landed at the root while the script looked in contracts/,
      # found nothing, and silently fell back to the COMMITTED .evm-standards.json - so the gate
      # would report on a stored record dated 2026-08-07 while appearing to read this run.
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: contracts/evidence
          merge-multiple: false

      - name: Merge evidence
        run: |
          python3 - <<'PY'
          import json, pathlib
          base = pathlib.Path(".evm-standards.json")
          cfg = json.loads(base.read_text()) if base.exists() else {}
          cfg.setdefault("evidence", {})
          for f in pathlib.Path("evidence").rglob(".evm-standards.json"):
              part = json.loads(f.read_text())
              cfg["evidence"].update(part.get("evidence", {}))
          base.write_text(json.dumps(cfg, indent=2) + "\n")
          print(json.dumps(cfg.get("evidence", {}), indent=2))
          PY

      - name: Run gate
        run: python3 lib/evm-security-standards/gate/check.py --project .

      - name: Gate report
        if: always()
        run: |
          python3 lib/evm-security-standards/gate/check.py --project . --json \
            > gate-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: contracts/gate-report.json

  # --------------------------------------------------------------------------
  # Deep campaigns. Scheduled, not per-commit.
  # --------------------------------------------------------------------------

  medusa:
    name: Medusa (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1

      # Same reason as the build job: Medusa compiles the project, so it needs the deps too.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Solidity dependencies
        run: npm ci

      # Restore the corpus so nightly runs compound instead of starting cold.
      # This is the setting that makes a fuzzing programme worth having.
      - uses: actions/cache@v4
        with:
          path: contracts/medusa-corpus
          key: medusa-corpus-${{ github.sha }}
          restore-keys: medusa-corpus-

      - name: Install Medusa
        run: |
          curl -sSL -o medusa.tar.gz \
            https://github.com/crytic/medusa/releases/latest/download/medusa-linux-x64.tar.gz
          tar -xzf medusa.tar.gz && sudo mv medusa /usr/local/bin/

      - name: Run Medusa
        run: medusa fuzz --config lib/evm-security-standards/tooling/medusa.json

  # ⚠️ Echidna is NOT configured for this repository. `contract:` below reads a repository VARIABLE
  # that has never been set (checked via the API: the repo has no Actions variables at all), so this
  # job would fire at 03:00 with an empty contract name and go red nightly, on a public repo. The
  # guard makes it SKIP visibly instead, which is the honest rendering of "not configured yet" - a
  # skipped job says so, whereas removing the job entirely would hide the gap. Set the variable and
  # the job starts running with no further edit here.
  echidna:
    name: Echidna (nightly)
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && vars.ECHIDNA_CONTRACT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1

      # Same reason as the build job. Present so that setting ECHIDNA_CONTRACT is the ONLY thing
      # standing between this job and a real run.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Solidity dependencies
        run: npm ci

      - uses: actions/cache@v4
        with:
          path: contracts/echidna-corpus
          key: echidna-corpus-${{ github.sha }}
          restore-keys: echidna-corpus-

      - uses: crytic/echidna-action@v2
        with:
          files: .
          contract: ${{ vars.ECHIDNA_CONTRACT }}
          config: lib/evm-security-standards/tooling/echidna.yaml
