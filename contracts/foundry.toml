[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# Robinhood Chain is an Arbitrum L2; keep our own bytecode PUSH0-free to be safe.
evm_version = "paris"
# Optimizer ON at the default 200 runs (build #24). Previously absent, which left LaunchpadFactory at
# 27,594 B — over EIP-170's 24,576 and deployable only because Orbit relaxes the limit. Optimized it
# is 15,857 B, so the deploy no longer depends on that relaxation and `forge script --broadcast` no
# longer needs `--non-interactive` to skip the oversize prompt. Also cheaper gas on every trade.
# These settings are part of what the auditors review: changing them changes the deployed bytecode,
# and Blockscout verification must be given the same values.
optimizer = true
optimizer_runs = 200
# Allow vm.getCode to read the official Uniswap V3 precompiled artifacts.
fs_permissions = [{ access = "read", path = "./node_modules" }]
# Build fails on any warning, compiler or lint (#40, gate item `q-no-warnings`). Compiler warnings
# are the cheapest findings there are and the ones a team learns to scroll past, so the only way they
# stay at zero is if a non-zero count stops the build. `deny = "warnings"` is forge 1.7's spelling of
# what used to be `deny_warnings = true`; the gate accepts either.
#
# ⚠️ This is what makes an inline `// forge-lint: disable-next-line(<id>)` load-bearing rather than
# decorative. Two exist, both in this repo, both carrying the reason next to them: LPLock's
# block.timestamp comparison and QuoterV2.t.sol's full-precision mulDiv. Deleting either comment
# breaks the build, which is the point - a suppression should be as visible as the warning was.
deny = "warnings"

# ⚠️ Pinned rather than left to forge's defaults, because the whole repo was reformatted in #40 after
# forge 1.7.1 wrapped 14 untouched files differently from whatever formatted them, and CI now runs
# `forge fmt --check`. These ARE forge 1.7.1's defaults; writing them down is what stops the next
# formatter release doing the same thing again.
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

# The local campaign. Deliberately modest: `forge test` runs on every change and a campaign that
# takes minutes is a campaign people stop running. CI runs the deep version below.
[profile.default.invariant]
runs = 64
depth = 64
# ⚠️ Keep this false. `fail_on_revert = true` turns every input the system legitimately rejects into a
# test failure, and the usual fix is to loosen the handler until nothing interesting is explored.
# `OctopusHandler` asserts on its own call counts instead, which is the check that actually catches an
# empty campaign.
fail_on_revert = false
shrink_run_limit = 5000

# ⚠️ `.github/workflows/evm-security.yml` sets FOUNDRY_PROFILE=ci and this section did not exist, so
# every CI job silently ran the default depth while the workflow's name implied a deep campaign.
[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 128
fail_on_revert = false
shrink_run_limit = 20000

[rpc_endpoints]
# The chains' documented public endpoints. Fine for broadcasting and for reading the head, but they
# PRUNE state after ~5,000 blocks and sit behind a load balancer whose nodes have differing
# retention, so a historical read is a coin flip (docs/rpc-capability.md). Do not fork from these.
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

# Archive endpoints, and the ONLY ones the fork tests use. Pinning a fork block is what makes a fork
# test reproducible instead of time-dependent, and a pinned block is only servable by a node that
# still holds state at that height - measured, the public testnet endpoint answers `missing trie
# node` 1.9M blocks deep where these answer normally. Both are set in `contracts/.env`, which forge
# loads automatically; see `contracts/.env.example` for how to build them.
robinhood_archive = "${RPC_MAINNET_ARCHIVE_URL}"
robinhood_testnet_archive = "${RPC_TESTNET_ARCHIVE_URL}"

# Blockscout verification for the deploy pipeline (#18). Robinhood Chain uses Blockscout, which is
# keyless — the api-key is a placeholder Blockscout ignores. Point the URLs at the chain's Blockscout
# instance via env (see docs/deploy.md); the deploy command passes `--verify --verifier blockscout`.
[etherscan]
robinhood = { key = "${BLOCKSCOUT_API_KEY}", url = "${BLOCKSCOUT_MAINNET_API}", chain = 4663 }
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY}", url = "${BLOCKSCOUT_TESTNET_API}", chain = 46630 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
