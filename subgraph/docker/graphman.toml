# Minimal graphman config for the local stack.
#
# graphman is graph-node's admin CLI and it refuses to start without --config, even for
# read-only subcommands like `info`. It ships inside the graph-node image, so this file just
# needs to be copied in:
#
#   docker cp subgraph/docker/graphman.toml launchpad-graph-node:/tmp/graphman.toml
#   docker exec launchpad-graph-node graphman --config /tmp/graphman.toml info --all
#
# The credentials and the provider URL are the same ones docker-compose.yml already uses, and
# the host names are container-internal (this runs inside the graph-node container, not on the
# host), so `postgres:5432` is correct here and `localhost:5434` is not.
#
# The command this exists for is `rewind`, when a reorg has left a deployment wedged on an
# orphaned branch. See "Recovering from a reorg deadlock" in ../README.md before using it.

[store]
[store.primary]
connection = "postgresql://graph-node:let-me-in@postgres:5432/graph-node"
pool_size = 5

[chains]
ingestor = "default"

[chains.robinhood-testnet]
shard = "primary"
protocol = "ethereum"
# `features = []`, deliberately. graph-node's own startup logs claim `capabilities: archive` for a
# bare `ethereum:` URL, and that claim is false for this endpoint - state is pruned after roughly
# 5,000 blocks (~26 min on testnet). See ../README.md, "graph-node declares `archive` capability -
# it is lying", and docs/rpc-capability.md. Nothing graphman does here needs archive state, so
# declaring it would be a falsehood committed to the repo for no benefit.
provider = [
  { label = "robinhood-testnet-rpc-0", url = "https://rpc.testnet.chain.robinhood.com", features = [] },
]

# ⚠️ TOML cannot read the environment, so unlike docker-compose.yml - which honours
# `${ROBINHOOD_RPC_URL:-…}` - this URL is fixed. If you point the indexer at a different endpoint
# via ROBINHOOD_RPC_URL, edit the url above to match before running `rewind`, or graphman will
# resolve block hashes against a different node than the one the indexer is following.

[deployment]
[[deployment.rule]]
indexers = ["default"]
