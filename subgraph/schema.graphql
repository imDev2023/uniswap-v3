# Subgraph schema — launchpad indexing (Build 08 / #19).
#
# Entities are shaped for the launchpad UI (spec #11, stories 11/26/27/28/29): a live curve-progress
# view per token, per-account curve positions, a trade history for charts, and a "just graduated" feed.
#
# Everything is derived from the launchpad's own rich events (BondingCurve.Bought/Sold/Graduation,
# LaunchpadFactory.LaunchCreated, GraduationManager.Graduated) — no eth_calls — so indexing is
# deterministic and unit-testable under matchstick.

"Global rollups across every launch. Singleton, id = \"launchpad\"."
type Factory @entity(immutable: false) {
  id: ID!
  "Number of tokens launched."
  launchCount: Int!
  "Number of tokens that have graduated to a locked V3 pool."
  graduationCount: Int!
  "Total curve trades (buys + sells)."
  tradeCount: Int!
  buyCount: Int!
  sellCount: Int!
  "Cumulative gross ETH traded against the curve, in wei (reserves-in + fee on buys, ETH out + fee on sells; excludes graduation refunds)."
  totalVolumeEth: BigInt!
  "Cumulative ETH raised across all graduations, in wei."
  totalRaisedEth: BigInt!
}

"A launched token and the live state of its bonding curve (stories 11/29)."
type Token @entity(immutable: false) {
  "Token address."
  id: Bytes!
  "The token's bonding curve."
  curve: Bytes!
  "The creator who launched it."
  creator: Bytes!
  name: String!
  symbol: String!
  "URI of the token's off-chain JSON metadata ({name, description, image, banner, links}). Set once at creation and permanent — there is no setter on the token. May be the empty string, meaning the creator supplied no metadata; clients should fall back to a default avatar. The URI is NOT resolved or validated here: the subgraph indexes the pointer, not its contents."
  metadataURI: String!

  createdAtTimestamp: BigInt!
  createdAtBlock: BigInt!
  createdAtTx: Bytes!

  # --- curve parameters, frozen into this launch's BondingCurve at creation ---
  # All six arrive in LaunchCreated (build #24), so they are known from the creation block onward
  # without any eth_call. `setCurveParams` is future-only, so these are per-launch and NOT global:
  # two tokens created either side of a retune legitimately carry different values.
  "Virtual ETH reserve the curve opened at, in wei. With virtualTokenReserve this fixes the opening price."
  virtualEthReserve: BigInt!
  "Virtual token reserve the curve opened at. Calibration-locked, so graduation price continuity holds for any virtualEthReserve."
  virtualTokenReserve: BigInt!
  "Maximum tokens this curve will ever sell (the 800M allocation). progressBps is measured against this."
  curveTokenAllocation: BigInt!
  "Curve trade fee in basis points, charged on both buys and sells."
  tradeFeeBps: Int!
  "Anti-snipe per-wallet buy cap, in tokens."
  maxBuyPerWallet: BigInt!
  "tokensSold level at which the anti-snipe cap auto-lifts. 0 means the cap was never armed for this launch."
  antiSnipeThreshold: BigInt!

  # --- live curve state, refreshed on every trade ---
  "Effective ETH reserve (virtual + real), in wei."
  ethReserve: BigInt!
  "Effective token reserve."
  tokenReserve: BigInt!
  "Cumulative tokens sold by the curve (0..800M)."
  tokensSold: BigInt!
  "Marginal price, ETH per token, scaled by 1e18. Seeded from the virtual reserves at creation, so an untraded launch reports its true opening price rather than 0."
  priceX18: BigInt!
  "Curve progress toward graduation, in basis points (tokensSold / curveTokenAllocation * 10000)."
  progressBps: Int!
  lastTradeTimestamp: BigInt!

  # --- aggregates ---
  buyCount: Int!
  sellCount: Int!
  tradeCount: Int!
  "Cumulative gross ETH traded against this curve, in wei (excludes graduation refunds)."
  volumeEth: BigInt!
  "Number of distinct addresses currently holding a positive curve position. NOT a token holder count - see CurvePosition."
  curvePositionCount: Int!

  # --- creator allocation, from LaunchConfig + DevVesting (#36) ---
  # ⚠️ Two honest numbers, and they differ for the whole vesting window. `devAllocation` is what the
  # creator is contractually entitled to and holds from creation; `devClaimed` is what has actually
  # reached their wallet. A UI showing only the first overstates near-term sell pressure; showing
  # only the second reads 0% for a launch where the tokens are already spoken for.
  "Tokens carved from the curve supply for the creator, held by DevVesting from the creation tx. 0 means no carve was taken and no grant exists."
  devAllocation: BigInt!
  "Cumulative tokens the creator has actually claimed out of the vault. Always <= devAllocation."
  devClaimed: BigInt!
  "Seconds the carve vests over, linearly. Measured FROM GRADUATION, so it does not start at creation. ⚠️ Always populated with the factory's setting at creation time, INCLUDING when devAllocation is 0 and no grant exists - it describes the terms that would have applied, not a live schedule. Check devAllocation > 0 before rendering any vesting UI."
  vestingDuration: BigInt!
  # ⚠️ There is deliberately NO `devVestedSoFar` field. The vested amount is a continuous function
  # of wall-clock time, and a subgraph only writes when an event fires, so any stored figure would
  # be silently stale between trades - worst on a quiet launch, where it would be most trusted.
  # Clients compute it from devAllocation, vestingDuration and graduatedAtTimestamp.

  # --- LP lock terms, frozen per launch at creation (#36) ---
  "Seconds the graduated LP position stays locked, from graduation. Meaningless when permanentLock is true - branch on that first."
  lockDuration: BigInt!
  "The creator's share of the graduated position's LP fees, in basis points."
  creatorFeeBps: Int!
  "True if the creator chose a permanent lock at creation. Terminal: it can never be undone."
  permanentLock: Boolean!
  "The lock record, once the launch has graduated and the position exists."
  lock: Lock

  # --- graduation ---
  graduated: Boolean!
  graduatedAtTimestamp: BigInt
  graduation: Graduation

  trades: [Trade!]! @derivedFrom(field: "token")
  curvePositions: [CurvePosition!]! @derivedFrom(field: "token")
}

enum TradeType {
  BUY
  SELL
}

"A single curve buy or sell — the trade history that backs price charts and feeds (story 27)."
type Trade @entity(immutable: true) {
  "txHash-logIndex."
  id: Bytes!
  token: Token!
  trader: Bytes!
  type: TradeType!
  "Gross ETH for a BUY (msg.value); net ETH received for a SELL. In wei."
  amountEth: BigInt!
  "ETH that actually entered the curve reserves on a BUY (net of fee and any graduation refund); 0 for a SELL."
  ethToCurve: BigInt!
  "Curve trade fee paid to the treasury, in wei."
  fee: BigInt!
  "Tokens received (BUY) or returned (SELL)."
  amountToken: BigInt!
  "Marginal price after the trade, ETH per token, scaled by 1e18."
  priceX18: BigInt!
  "Curve reserves/sold after the trade."
  ethReserve: BigInt!
  tokenReserve: BigInt!
  tokensSold: BigInt!

  timestamp: BigInt!
  block: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
}

"""
An address's position on a token's CURVE, netted from its buys and sells (stories 26/27).

⚠️ This is NOT a token holder, and was called `Holder` until #36. It counts curve activity only:
 - It ignores ERC-20 transfers. Buy on the curve, send the tokens away, and this still names you.
 - It ignores the pool. After graduation the curve stops trading forever, so every position here
   freezes permanently while the real holders change with every swap. A graduated launch's
   positions are FINAL, not current, and a UI must say so.
 - It ignores the creator's dev allocation, which is a free carve rather than a curve buy. That
   figure lives on `Token.devAllocation`, not here.

Indexing ERC-20 transfers to make "holder" literally true was considered and declined: a new data
source, new mappings and new tests, for accuracy on a panel that is not on the trade path.
"""
type CurvePosition @entity(immutable: false) {
  "token-account."
  id: Bytes!
  token: Token!
  account: Bytes!
  "Net tokens acquired from the curve (bought - sold). Never negative."
  balance: BigInt!
  "Lifetime gross tokens bought from the curve."
  bought: BigInt!
  "Lifetime gross tokens sold back to the curve."
  sold: BigInt!
  firstTradeTimestamp: BigInt!
  lastTradeTimestamp: BigInt!
  tradeCount: Int!
}

"A graduation into a permanently-locked, full-range V3 pool — the \"just graduated\" feed (story 28)."
type Graduation @entity(immutable: false) {
  "Token address (one graduation per token)."
  id: Bytes!
  token: Token!
  "The seeded TOKEN/WETH V3 pool."
  pool: Bytes!
  "The locked position NFT id held by LPLock."
  tokenId: BigInt!
  "Tokens seeded into the pool (the 200M graduation reserve)."
  tokensSeeded: BigInt!
  "WETH seeded into the pool (== raised ETH), in wei."
  wethSeeded: BigInt!
  "Pool initialization price, sqrt(price) * 2^96."
  sqrtPriceX96: BigInt!
  "ETH raised on the curve and forwarded into the pool, in wei."
  raisedEth: BigInt!
  timestamp: BigInt!
  block: BigInt!
  txHash: Bytes!
}

"""
The LP lock on a graduated position (#33, #36). One per graduated launch.

⚠️ The lock is CONDITIONAL, not permanent, unless `permanent` is true - see ADR-0005. Any UI string
saying "locked forever" is wrong for the default case.
"""
type Lock @entity(immutable: false) {
  "The locked position NFT id, as a decimal string."
  id: ID!
  token: Token!
  "The TOKEN/WETH V3 pool the position is in."
  pool: Bytes!
  """
  Which system created this lock. ⚠️ `None` is the ZERO slot and means unregistered; only `Launch`
  positions are ever reclaimable. Reordering this enum on-chain silently makes third-party
  positions reclaimable, so the ordering is load-bearing.
  """
  origin: LockOrigin!
  "Unix seconds until which the position is locked. Meaningless when `permanent` - branch on that first."
  lockUntil: BigInt!
  """
  True if this lock can never expire. Terminal.

  ⚠️ DERIVED, not emitted. There is no permanent flag on-chain: `LPLock` encodes it as the sentinel
  `lockUntil == type(uint64).max`. A client that compared `lockUntil` against `block.timestamp`
  without checking this would render a permanent lock as expiring in the year 584942417355.
  """
  permanent: Boolean!
  "The creator's share of this position's LP fees, in basis points."
  creatorFeeBps: Int!
  "Number of times the creator has extended the lock. Extension is monotonic: it can only lengthen."
  extendCount: Int!
  "True once the position has been reclaimed, which is terminal."
  reclaimed: Boolean!
  "ETH sent to the treasury on reclaim, in wei. Null until reclaimed."
  reclaimedEth: BigInt
  "Tokens burned on reclaim. Null until reclaimed."
  reclaimedTokensBurned: BigInt
  reclaimedAtTimestamp: BigInt

  registeredAtTimestamp: BigInt!
  registeredAtBlock: BigInt!
  registeredAtTx: Bytes!
}

"⚠️ `None` MUST stay the zero slot: every field of an unregistered key reads as zero, so a status enum whose first member is a privileged one silently grants that status to everything never registered."
enum LockOrigin {
  None
  Launch
  ThirdParty
}
