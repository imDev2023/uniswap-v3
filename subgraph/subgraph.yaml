# Launchpad subgraph manifest (Build 08 / #19).
#
# Indexes the launchpad on Robinhood Chain (eip155:4663). The Graph's hosted/decentralized networks
# do NOT support chain 4663, so this is deployed to a SELF-HOSTED graph-node pointed at the Robinhood
# RPC (see README). `network: robinhood` is the name that graph-node's `ethereum:` config binds to the
# 4663 RPC — a deploy/infra detail, not a chain choice.
#
# Contract addresses + startBlock are placeholders until the contracts are broadcast (#18 needs deploy
# keys). Fill them in networks.json and run `graph build --network robinhood`, which rewrites the
# addresses below from that file. Curve addresses are discovered at runtime from LaunchCreated, so
# BondingCurve is a template (no fixed address).
specVersion: 1.0.0
description: Octopus — bonding-curve launchpad and DEX on Robinhood Chain. Indexes curve progress, trades, curve positions, locks, vesting and the graduation feed.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: LaunchpadFactory
    network: robinhood
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: LaunchpadFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities:
        - Factory
        - Token
      abis:
        - name: LaunchpadFactory
          file: ./abis/LaunchpadFactory.json
      eventHandlers:
        # ⚠️ Order in this list does NOT control handler order - graph-node dispatches strictly by
        # log order within the transaction. LaunchCreated is emitted before LaunchConfig on-chain,
        # deliberately, so the Token entity exists when handleLaunchConfig runs. That ordering is
        # pinned by contracts/test/LaunchConfig.t.sol, not by this file.
        - event: LaunchCreated(indexed address,indexed address,indexed address,string,string,string,uint256,uint256,uint256,uint16,uint256,uint256)
          handler: handleLaunchCreated
        - event: LaunchConfig(indexed address,uint256,uint64,uint64,uint16,bool)
          handler: handleLaunchConfig
  - kind: ethereum
    name: GraduationManager
    network: robinhood
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: GraduationManager
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/graduation-manager.ts
      entities:
        - Token
        - Graduation
      abis:
        - name: GraduationManager
          file: ./abis/GraduationManager.json
      eventHandlers:
        - event: Graduated(indexed address,indexed address,uint256,uint256,uint256,uint160)
          handler: handleGraduated
  # DevVesting and LPLock are deployed by the LaunchpadFactory's CONSTRUCTOR, so their addresses are
  # fixed and known once the factory is deployed. That makes them plain data sources rather than
  # templates, which is the whole reason #33-#35 emit from them: a fixed-address contract is always
  # indexing, so its logs in the creation transaction cannot arrive before the source exists.
  - kind: ethereum
    name: DevVesting
    network: robinhood
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: DevVesting
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/dev-vesting.ts
      entities:
        - Token
      abis:
        - name: DevVesting
          file: ./abis/DevVesting.json
      eventHandlers:
        - event: Claimed(indexed address,indexed address,uint256,uint256)
          handler: handleClaimed
  - kind: ethereum
    name: LPLock
    network: robinhood
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: LPLock
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/lp-lock.ts
      entities:
        - Lock
        - Token
      abis:
        - name: LPLock
          file: ./abis/LPLock.json
      eventHandlers:
        - event: LockRegistered(indexed uint256,indexed address,indexed address,uint8,uint64,uint16)
          handler: handleLockRegistered
        - event: LockExtended(indexed uint256,uint64,uint64)
          handler: handleLockExtended
        - event: Reclaimed(indexed uint256,indexed address,uint256,uint256)
          handler: handleReclaimed
templates:
  - kind: ethereum
    name: BondingCurve
    network: robinhood
    source:
      abi: BondingCurve
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/bonding-curve.ts
      entities:
        - Token
        - Trade
        - CurvePosition
      abis:
        - name: BondingCurve
          file: ./abis/BondingCurve.json
      eventHandlers:
        - event: Bought(indexed address,indexed address,uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleBought
        - event: Sold(indexed address,indexed address,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleSold
        - event: Graduation(indexed address,uint256)
          handler: handleGraduation
